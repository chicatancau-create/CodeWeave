<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0f131b" />
    <!-- 产品底色自 M3 起是纯黑（design/tokens.css:25 --ds-canvas: #000），
         这里原先写死的 #101827 是切换前的旧蓝主题残留，移动浏览器会拿它画地址栏。 -->
    <meta name="description" content="Code Canvas：用可视化方式学习和运行代码。" />

         （M6 §4.2 的页面消息采集抓到的）。内嵌 SVG 数据 URL，不新增文件也不新增依赖。 -->

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23ff7a2f' stroke-width='2.5'/%3E%3Ccircle cx='24.6' cy='9.4' r='2.4' fill='%23ff7a2f'/%3E%3C/svg%3E"
    />

  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
